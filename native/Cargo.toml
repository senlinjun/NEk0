[package]
name = "tsclient"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib.git", branch = "master", default-features = false, features = ["unstable"] }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib.git", branch = "master", default-features = false }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib.git", branch = "master" }
# Same vendored copy the patched crates use internally (relative path), needed
# for crypto::encode_password when joining password-protected channels.
tsproto-types = { path = "local_tsclientlib/utils/tsproto-types" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
futures = "0.3"
opus-rs = "0.1"
arrayvec = "0.7"
cpal = "0.15"
dashmap = "6"
crossbeam = "0.8"
arc-swap = "1"
# `time::Duration` for the ban command (OutBanClientPart.time). Already in the
# lockfile via tsclientlib; only the Duration type is used, no extra features.
time = "0.3"
# Decoding the wire-format uid into raw bytes so `Uid::as_avatar` can build
# the avatar file path. Already in the lockfile via tsproto-types.
base64 = "0.22"
# MD5 of the uploaded avatar file — the value sent as client_flag_avatar in
# the clientupdate that makes the new avatar visible to everyone.
md-5 = "0.10"

[patch."https://github.com/ReSpeak/tsclientlib.git"]
tsclientlib = { path = "local_tsclientlib/tsclientlib" }
tsproto = { path = "local_tsclientlib/tsproto" }
tsproto-packets = { path = "local_tsclientlib/utils/tsproto-packets" }
