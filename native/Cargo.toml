[package]
name = "tsclient"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Protocol/session engine (replaces the vendored tsclientlib): unified
# voice-platform library with a TS3 driver, pinned by rev. `default-features
# = false` keeps out univox's `voice` feature (its audiopus codec) — Nek0
# runs its own Opus via opus-rs, and two static libopus builds cannot link
# into one cdylib (and audiopus_sys wants cmake on Android).
univox-core = { git = "https://github.com/senlinjun/univox.git", rev = "13ab772e80f8fbc8205fadf3b24827d7c48a4944" }
univox-ts3 = { git = "https://github.com/senlinjun/univox.git", rev = "13ab772e80f8fbc8205fadf3b24827d7c48a4944", default-features = false }
univox-ts3-proto = { git = "https://github.com/senlinjun/univox.git", rev = "13ab772e80f8fbc8205fadf3b24827d7c48a4944" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
futures = "0.3"
# Formatter subscriber for univox's internal tracing — without it every
# connection-level warn (timeouts, unacked packets) is silently dropped.
tracing-subscriber = "0.3"
# >= 0.1.33 required: earlier releases undersize the decoder's SILK work
# buffer (w_pcm_i16 = 640 samples), so 40/60 ms SILK frames (up to 960
# samples per channel) panic with a slice range error in release builds.
opus-rs = "0.1.33"
arrayvec = "0.7"
cpal = "0.15"
dashmap = "6"
crossbeam = "0.8"
arc-swap = "1"
# Pure-Rust RNNoise port: speech-probability VAD + optional denoise for the
# mic uplink. 48 kHz / 480-sample frames, i16-range f32 input, returns the
# frame voice probability (see native/src/vad.rs).
nnnoiseless = "0.5"

# Android-only: cpal/oboe resolve the JVM through ndk-context and query
# AudioTrack buffer sizes via JNI when building streams. The context is
# handed over by MainActivity via the tsInitAndroid JNI export (see api.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Linux-only: stable ALSA device enumeration for the picker UI. cpal's
# probe-open enumeration drops any PCM the sound server currently holds, so
# the list would grow/shrink with PipeWire activity; snd_device_name_hint
# (via HintIter) is static config and never changes under load. Same version
# cpal depends on (0.9.1) so both share one compilation.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

