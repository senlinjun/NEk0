name: Lint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Flutter action
      uses: subosito/flutter-action@v2.23.0
    - name: Setup Python
      uses: actions/setup-python@v7.0.0
    - name: Check Rust
      run: cd Nek0/native |
           cargo check
    - name: Prebuild
      run: cd Nek0 |
           python3 pre_build.py
    - name: Flutter check
      run: cd Nek0 |
           flutter format --set-exit-if-changed |
           flutter analyze
